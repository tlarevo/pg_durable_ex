services:
  pg_durable_pg18:
    image: ghcr.io/microsoft/pg_durable:v0.2.7-pg18
    platform: linux/amd64
    container_name: pg_durable_test_pg18
    environment:
      POSTGRES_PASSWORD: pg_durable_test
    ports:
      - "55418:5432"
    command: >
      postgres
        -c shared_preload_libraries='pg_durable'
        -c pg_durable.database_name='postgres'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
