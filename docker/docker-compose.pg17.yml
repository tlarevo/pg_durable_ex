services:
  pg_durable_pg17:
    image: postgres:17
    container_name: pg_durable_test_pg17
    environment:
      POSTGRES_DB: pg_durable_test
      POSTGRES_USER: pg_durable_test
      POSTGRES_PASSWORD: pg_durable_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55417:5432"
    command: >
      postgres
        -c shared_preload_libraries='pg_durable'
        -c pg_durable.database_name='pg_durable_test'
        -c pg_durable.worker_role='pg_durable_test'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg_durable_test -d pg_durable_test"]
      interval: 2s
      timeout: 5s
      retries: 30
